{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ethiack-beacon.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ethiack-beacon.labels" . | nindent 4 }}
type: Opaque
{{- /* data/b64enc rather than stringData: stringData is write-only, so the
       API server stores these under `data` and the live object never has a
       `stringData` field. Dropping a key from a stringData manifest makes
       helm emit `stringData: {KEY: null}`, which is inert against `data` -
       the removed key would survive the upgrade. With `data`, clearing
       credentials.apiSecret actually removes ETHIACK_API_SECRET.

       One exception, for releases first installed on chart <= 0.1.0 (which
       rendered stringData): that release's stored manifest names the key
       under stringData, so helm computes no `data` deletion for it and the
       old value stays orphaned in the live Secret. It is ignored by the CLI
       (auth scheme is chosen by the key prefix, never by secret presence),
       but to clear it, delete the Secret once and re-run helm upgrade. See
       "Upgrading to chart 0.2.0" in the repo README. */}}
{{- $apiKey := .Values.credentials.apiKey | required "credentials.apiKey is required" -}}
{{- /* Same prefix test the CLI and the Ansible assert use, so all three
       agree on when a secret is mandatory. A legacy key with no secret makes
       the CLI exit on startup ("Missing required environment variables:
       ETHIACK_API_SECRET") and the pod crashloop - cheaper to catch here. */}}
{{- $isModernKey := hasPrefix "phx_" $apiKey -}}
{{- if and (not .Values.credentials.apiSecret) (not $isModernKey) }}
  {{- fail "credentials.apiSecret is required for legacy (non-phx_) API keys. Leave it empty only for a phx_-prefixed key." }}
{{- end }}
data:
  ETHIACK_API_KEY: {{ $apiKey | b64enc | quote }}
  {{- /* Legacy (non-phx_) keys only. Omitted entirely rather than rendered
         empty: envFrom would inject a present-but-empty ETHIACK_API_SECRET,
         and the CLI picks its auth scheme from the key prefix. */}}
  {{- if .Values.credentials.apiSecret }}
  ETHIACK_API_SECRET: {{ .Values.credentials.apiSecret | b64enc | quote }}
  {{- end }}
{{- end }}
